[project]
name = "ranking"
version = "0.0.1"
description = ""
authors = [
    {name = "Fabien Letort"}
]
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "beautifulsoup4>=4.15.0,<5.0.0",
    "structlog (>=26.1.0,<27.0.0)",
    "click (>=8.4.2,<9.0.0)",
    "boto3>=1.43.79",
]

[tool.poetry.group.dev.dependencies]
ruff = "^0.15"
mypy = "^2.3.0"
pytest = "^9.1.1"
pytest-httpx = "^0.36.2"
pyyaml = "^6.0.3"
moto = {extras = ["s3"], version = "^5.2.2"}

[project.scripts]
ranking = "ranking.cli:cli"

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true

[tool.poetry]
packages = [{ include = "ranking", from = "src"}]

[tool.ruff]
line-length = 100
fix = true

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
pythonpath = ["."]
markers = [
    "unit: unit tests",
    "case: functional parsing cases"
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
